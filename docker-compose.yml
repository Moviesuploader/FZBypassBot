services:
  fzbypass:
    build:
      context: .
      dockerfile: Dockerfile
    image: fzbypassbot:local
    container_name: fzbypassbot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
